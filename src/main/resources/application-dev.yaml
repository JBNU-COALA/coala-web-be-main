spring:
  config:
    import: optional:file:.env[.properties]  # .env 파일 값 읽기

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 환경변수 미설정 시 로컬 전용 기본값 (배포 시 반드시 JWT_SECRET 설정)
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000