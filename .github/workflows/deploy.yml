name: Deploy Back Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      reset_database:
        description: "Drop the public schema and recreate it from the current backend entities."
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESET_DATABASE_ON_DEPLOY: ${{ contains(github.event.head_commit.message, '[reset-db]') || (github.event_name == 'workflow_dispatch' && inputs.reset_database == true) }}

    steps:
      - name: Deploy back server
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESET_DATABASE_ON_DEPLOY: ${{ env.RESET_DATABASE_ON_DEPLOY }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          SWAGGER_ENABLED: ${{ secrets.SWAGGER_ENABLED }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
          APP_SEED_DEV_ACCOUNT_ENABLED: ${{ secrets.APP_SEED_DEV_ACCOUNT_ENABLED }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: RESET_DATABASE_ON_DEPLOY,DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,APP_CORS_ALLOWED_ORIGINS,SWAGGER_ENABLED,REDIS_URL,REDIS_PORT,REDIS_PASSWORD,GITHUB_API_TOKEN,APP_SEED_DEV_ACCOUNT_ENABLED
          script: |
            set -euo pipefail
            cd /home/ubuntu/coala-web-be-main
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

            read_env_value() {
              [ -f .env ] || return 0
              sed -n "s/^$1=//p" .env | tail -n 1
            }

            if [ -n "${DB_URL:-}" ]; then
              DB_USERNAME="${DB_USERNAME:-$(read_env_value DB_USERNAME)}"
              DB_PASSWORD="${DB_PASSWORD:-$(read_env_value DB_PASSWORD)}"
              JWT_SECRET="${JWT_SECRET:-$(read_env_value JWT_SECRET)}"
              APP_CORS_ALLOWED_ORIGINS="${APP_CORS_ALLOWED_ORIGINS:-$(read_env_value APP_CORS_ALLOWED_ORIGINS)}"
              SWAGGER_ENABLED="${SWAGGER_ENABLED:-$(read_env_value SWAGGER_ENABLED)}"
              REDIS_URL="${REDIS_URL:-$(read_env_value REDIS_URL)}"
              REDIS_PORT="${REDIS_PORT:-$(read_env_value REDIS_PORT)}"
              REDIS_PASSWORD="${REDIS_PASSWORD:-$(read_env_value REDIS_PASSWORD)}"
              GITHUB_API_TOKEN="${GITHUB_API_TOKEN:-$(read_env_value GITHUB_API_TOKEN)}"
              APP_SEED_DEV_ACCOUNT_ENABLED="${APP_SEED_DEV_ACCOUNT_ENABLED:-$(read_env_value APP_SEED_DEV_ACCOUNT_ENABLED)}"

              umask 077
              cat > .env <<EOF
            DB_URL=${DB_URL}
            DB_USERNAME=${DB_USERNAME:-}
            DB_PASSWORD=${DB_PASSWORD:-}
            JWT_SECRET=${JWT_SECRET:-}
            SPRING_PROFILES_ACTIVE=prod
            APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-}
            SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
            REDIS_URL=${REDIS_URL:-127.0.0.1}
            REDIS_PORT=${REDIS_PORT:-6379}
            REDIS_PASSWORD=${REDIS_PASSWORD:-}
            GITHUB_API_BASE_URL=https://api.github.com
            GITHUB_API_TOKEN=${GITHUB_API_TOKEN:-}
            APP_SEED_DEV_ACCOUNT_ENABLED=${APP_SEED_DEV_ACCOUNT_ENABLED:-true}
            EOF
            fi

            load_runtime_env() {
              DB_URL="${DB_URL:-$(read_env_value DB_URL)}"
              DB_USERNAME="${DB_USERNAME:-$(read_env_value DB_USERNAME)}"
              DB_PASSWORD="${DB_PASSWORD:-$(read_env_value DB_PASSWORD)}"
              JWT_SECRET="${JWT_SECRET:-$(read_env_value JWT_SECRET)}"
              APP_CORS_ALLOWED_ORIGINS="${APP_CORS_ALLOWED_ORIGINS:-$(read_env_value APP_CORS_ALLOWED_ORIGINS)}"
              APP_CORS_ALLOWED_ORIGINS="${APP_CORS_ALLOWED_ORIGINS:-https://coala.jbnu.ac.kr,http://coala.jbnu.ac.kr,http://localhost:3000,http://127.0.0.1:3000}"
              REDIS_URL="${REDIS_URL:-$(read_env_value REDIS_URL)}"
              REDIS_PORT="${REDIS_PORT:-$(read_env_value REDIS_PORT)}"
              REDIS_PASSWORD="${REDIS_PASSWORD:-$(read_env_value REDIS_PASSWORD)}"
              APP_SEED_DEV_ACCOUNT_ENABLED="${APP_SEED_DEV_ACCOUNT_ENABLED:-$(read_env_value APP_SEED_DEV_ACCOUNT_ENABLED)}"
              APP_SEED_DEV_ACCOUNT_ENABLED="${APP_SEED_DEV_ACCOUNT_ENABLED:-true}"
              export DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET APP_CORS_ALLOWED_ORIGINS REDIS_URL REDIS_PORT REDIS_PASSWORD APP_SEED_DEV_ACCOUNT_ENABLED
            }

            require_runtime_env() {
              load_runtime_env
              for name in DB_URL DB_USERNAME JWT_SECRET APP_CORS_ALLOWED_ORIGINS REDIS_URL REDIS_PORT; do
                eval "value=\${$name:-}"
                if [ -z "$value" ]; then
                  echo "$name is required for deployment. Add it to the server .env file or GitHub Actions secrets."
                  exit 1
                fi
              done
            }

            chmod +x ./gradlew
            ./gradlew clean bootJar

            reset_schema() {
              require_runtime_env

              PSQL_URL="${DB_URL#jdbc:}"
              PSQL_URL="${PSQL_URL%%\?*}"
              if command -v psql >/dev/null 2>&1; then
                PGPASSWORD="${DB_PASSWORD:-}" psql "$PSQL_URL" -U "${DB_USERNAME:-postgres}" -v ON_ERROR_STOP=1 \
                  -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"
              else
                docker run --rm -e PGPASSWORD="${DB_PASSWORD:-}" postgres:16-alpine \
                  psql "$PSQL_URL" -U "${DB_USERNAME:-postgres}" -v ON_ERROR_STOP=1 \
                  -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"
              fi
            }

            ensure_container_running() {
              local container_name="coala-web-be-main"
              local initial_restart_count inspect_output status running restart_count exit_code health

              initial_restart_count="$(docker inspect -f '{{.RestartCount}}' "$container_name" 2>/dev/null || echo 0)"

              for _ in $(seq 1 12); do
                inspect_output="$(docker inspect -f '{{.State.Status}} {{.State.Running}} {{.RestartCount}} {{.State.ExitCode}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_name" 2>/dev/null || echo 'missing false 0 1 none')"
                read -r status running restart_count exit_code health <<< "$inspect_output"

                if [ "$status" != "running" ] || [ "$running" != "true" ]; then
                  docker logs --tail=200 "$container_name" 2>/dev/null || true
                  exit 1
                fi

                if [ "$restart_count" -gt "$initial_restart_count" ]; then
                  echo "Container entered a restart loop during deployment."
                  docker logs --tail=200 "$container_name" 2>/dev/null || true
                  exit 1
                fi

                if [ "$health" = "unhealthy" ]; then
                  echo "Container reported unhealthy status during deployment."
                  docker logs --tail=200 "$container_name" 2>/dev/null || true
                  exit 1
                fi

                sleep 5
              done
            }

            deploy_with_compose() {
              local compose_cmd="$1"
              require_runtime_env
              docker rm -f coala-web-be-main 2>/dev/null || true

              if [ "${RESET_DATABASE_ON_DEPLOY:-false}" = "true" ]; then
                echo "Resetting database schema and creating tables from backend entities."
                reset_schema
                SPRING_JPA_HIBERNATE_DDL_AUTO=create $compose_cmd up -d --build
                ensure_container_running
                docker rm -f coala-web-be-main 2>/dev/null || true
              fi

              SPRING_JPA_HIBERNATE_DDL_AUTO=validate $compose_cmd up -d --build
              ensure_container_running
            }

            if docker compose version >/dev/null 2>&1; then
              deploy_with_compose "docker compose"
            else
              deploy_with_compose "docker-compose"
            fi
