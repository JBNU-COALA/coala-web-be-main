name: Deploy Back Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      reset_database:
        description: "Drop the public schema and recreate it from the current backend entities."
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESET_DATABASE_ON_DEPLOY: ${{ contains(github.event.head_commit.message, '[reset-db]') || (github.event_name == 'workflow_dispatch' && inputs.reset_database == true) }}

    steps:
      - name: Deploy back server
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESET_DATABASE_ON_DEPLOY: ${{ env.RESET_DATABASE_ON_DEPLOY }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          SWAGGER_ENABLED: ${{ secrets.SWAGGER_ENABLED }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 19231
          envs: RESET_DATABASE_ON_DEPLOY,DB_URL,DB_USERNAME,DB_PASSWORD,JWT_SECRET,APP_CORS_ALLOWED_ORIGINS,SWAGGER_ENABLED,REDIS_URL,REDIS_PORT,REDIS_PASSWORD,GITHUB_API_TOKEN
          script: |
            set -euo pipefail
            cd /home/ubuntu/coala-web-be-main
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

            read_env_value() {
              [ -f .env ] || return 0
              grep -E "^$1=" .env | tail -n 1 | sed "s/^$1=//"
            }

            if [ -n "${DB_URL:-}" ]; then
              DB_USERNAME="${DB_USERNAME:-$(read_env_value DB_USERNAME)}"
              DB_PASSWORD="${DB_PASSWORD:-$(read_env_value DB_PASSWORD)}"
              JWT_SECRET="${JWT_SECRET:-$(read_env_value JWT_SECRET)}"
              APP_CORS_ALLOWED_ORIGINS="${APP_CORS_ALLOWED_ORIGINS:-$(read_env_value APP_CORS_ALLOWED_ORIGINS)}"
              SWAGGER_ENABLED="${SWAGGER_ENABLED:-$(read_env_value SWAGGER_ENABLED)}"
              REDIS_URL="${REDIS_URL:-$(read_env_value REDIS_URL)}"
              REDIS_PORT="${REDIS_PORT:-$(read_env_value REDIS_PORT)}"
              REDIS_PASSWORD="${REDIS_PASSWORD:-$(read_env_value REDIS_PASSWORD)}"
              GITHUB_API_TOKEN="${GITHUB_API_TOKEN:-$(read_env_value GITHUB_API_TOKEN)}"

              umask 077
              cat > .env <<EOF
            DB_URL=${DB_URL}
            DB_USERNAME=${DB_USERNAME:-}
            DB_PASSWORD=${DB_PASSWORD:-}
            JWT_SECRET=${JWT_SECRET:-}
            SPRING_PROFILES_ACTIVE=prod
            APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-}
            SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
            REDIS_URL=${REDIS_URL:-127.0.0.1}
            REDIS_PORT=${REDIS_PORT:-6379}
            REDIS_PASSWORD=${REDIS_PASSWORD:-}
            GITHUB_API_BASE_URL=https://api.github.com
            GITHUB_API_TOKEN=${GITHUB_API_TOKEN:-}
            EOF
            fi

            load_runtime_env() {
              DB_URL="${DB_URL:-$(read_env_value DB_URL)}"
              DB_USERNAME="${DB_USERNAME:-$(read_env_value DB_USERNAME)}"
              DB_PASSWORD="${DB_PASSWORD:-$(read_env_value DB_PASSWORD)}"
              JWT_SECRET="${JWT_SECRET:-$(read_env_value JWT_SECRET)}"
              APP_CORS_ALLOWED_ORIGINS="${APP_CORS_ALLOWED_ORIGINS:-$(read_env_value APP_CORS_ALLOWED_ORIGINS)}"
              REDIS_URL="${REDIS_URL:-$(read_env_value REDIS_URL)}"
              REDIS_PORT="${REDIS_PORT:-$(read_env_value REDIS_PORT)}"
              REDIS_PASSWORD="${REDIS_PASSWORD:-$(read_env_value REDIS_PASSWORD)}"
              export DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET APP_CORS_ALLOWED_ORIGINS REDIS_URL REDIS_PORT REDIS_PASSWORD
            }

            require_runtime_env() {
              load_runtime_env
              for name in DB_URL DB_USERNAME JWT_SECRET APP_CORS_ALLOWED_ORIGINS REDIS_URL REDIS_PORT; do
                eval "value=\${$name:-}"
                if [ -z "$value" ]; then
                  echo "$name is required for deployment."
                  exit 1
                fi
              done
            }

            chmod +x ./gradlew
            ./gradlew clean bootJar

            reset_schema() {
              require_runtime_env

              PSQL_URL="${DB_URL#jdbc:}"
              if command -v psql >/dev/null 2>&1; then
                PGPASSWORD="${DB_PASSWORD:-}" psql "$PSQL_URL" -U "${DB_USERNAME:-postgres}" -v ON_ERROR_STOP=1 \
                  -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"
              else
                docker run --rm -e PGPASSWORD="${DB_PASSWORD:-}" postgres:16-alpine \
                  psql "$PSQL_URL" -U "${DB_USERNAME:-postgres}" -v ON_ERROR_STOP=1 \
                  -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;"
              fi
            }

            ensure_container_running() {
              sleep 25
              if ! docker inspect -f '{{.State.Running}}' coala-web-be-main 2>/dev/null | grep -q true; then
                docker logs --tail=200 coala-web-be-main 2>/dev/null || true
                exit 1
              fi
            }

            deploy_with_compose() {
              local compose_cmd="$1"
              require_runtime_env
              docker rm -f coala-web-be-main 2>/dev/null || true

              if [ "${RESET_DATABASE_ON_DEPLOY:-false}" = "true" ]; then
                echo "Resetting database schema and creating tables from backend entities."
                reset_schema
                SPRING_JPA_HIBERNATE_DDL_AUTO=create $compose_cmd up -d --build
                ensure_container_running
                docker rm -f coala-web-be-main 2>/dev/null || true
              fi

              SPRING_JPA_HIBERNATE_DDL_AUTO=validate $compose_cmd up -d --build
              ensure_container_running
            }

            if docker compose version >/dev/null 2>&1; then
              deploy_with_compose "docker compose"
            else
              deploy_with_compose "docker-compose"
            fi
